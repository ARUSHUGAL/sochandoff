# Local TheHive 5 lab for testing sochandoff. Not for production.
# Sized for a laptop: about 3 GB of RAM total.
# Binds to 127.0.0.1 only, so nothing is reachable from your network.
services:
  cassandra:
    image: cassandra:4.1
    environment:
      MAX_HEAP_SIZE: 768M
      HEAP_NEWSIZE: 128M
      CASSANDRA_CLUSTER_NAME: thehive
    volumes:
      - cassandra:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.25
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - elasticsearch:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

  thehive:
    image: strangebee/thehive:5.4
    depends_on:
      cassandra: {condition: service_healthy}
      elasticsearch: {condition: service_healthy}
    environment:
      JVM_OPTS: -Xms512m -Xmx1g
    command:
      - --secret
      - "lab-only-not-a-real-secret-change-me-0123456789"
      - --cql-hostnames
      - cassandra
      - --index-backend
      - elasticsearch
      - --es-hostnames
      - elasticsearch
      - --no-config-cortex
    ports:
      - "127.0.0.1:9000:9000"

volumes:
  cassandra:
  elasticsearch:
